<svg width="780" height="280" viewBox="0 0 780 280" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="jobenpayLogoTitle jobenpayLogoDesc">
  <title id="jobenpayLogoTitle">JobenPay Logo</title>
  <desc id="jobenpayLogoDesc">Transparent JobenPay wordmark with JPay endorsement line.</desc>
  <defs>
    <linearGradient id="jobenpayAccent" x1="470" y1="24" x2="746" y2="170" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0070E0" />
      <stop offset="1" stop-color="#179BFF" />
    </linearGradient>
    <linearGradient id="jobenpayLine" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#7FC6FF" stop-opacity="0" />
      <stop offset="0.2" stop-color="#1393FF" stop-opacity="0.92" />
      <stop offset="0.8" stop-color="#1393FF" stop-opacity="0.92" />
      <stop offset="1" stop-color="#7FC6FF" stop-opacity="0" />
    </linearGradient>
  </defs>
  <g>
    <text x="18" y="154" fill="#003087" font-size="156" font-style="italic" font-weight="800" font-family="Segoe UI, Arial, sans-serif" letter-spacing="-7">
      Joben
    </text>
    <text x="438" y="154" fill="url(#jobenpayAccent)" font-size="156" font-style="italic" font-weight="800" font-family="Segoe UI, Arial, sans-serif" letter-spacing="-7">
      Pay
    </text>
    <rect x="48" y="215" width="175" height="6" rx="3" fill="url(#jobenpayLine)" />
    <rect x="528" y="215" width="165" height="6" rx="3" fill="url(#jobenpayLine)" />
    <text x="250" y="248" fill="#003087" font-size="82" font-style="italic" font-weight="800" font-family="Segoe UI, Arial, sans-serif" letter-spacing="2">
      JPay
    </text>
  </g>
</svg>
