name: CI

on:
  push:
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: jobenpay_test
          POSTGRES_USER: jobenpay
          POSTGRES_PASSWORD: jobenpay
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jobenpay -d jobenpay_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql://jobenpay:jobenpay@localhost:5432/jobenpay_test
      SEED_OWNER_PASSWORD: E2E-Owner-Password-2026!
      SEED_JUDGE_PASSWORD: E2E-Judge-Password-2026!
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
      - run: npm ci
      - run: npm ci --prefix web
      - name: Configure ephemeral test keys
        run: |
          node --input-type=module -e "import { appendFileSync } from 'node:fs'; import { generateKeyPairSync, randomBytes } from 'node:crypto'; const signingKey = generateKeyPairSync('ed25519').privateKey.export({ format: 'der', type: 'pkcs8' }).toString('base64'); const values = { JOBENPAY_ENC_KEY: randomBytes(32).toString('base64'), JOBENPAY_LEDGER_SIGNING_KEY: signingKey, JOBENPAY_HMAC_PEPPER: randomBytes(32).toString('base64') }; appendFileSync(process.env.GITHUB_ENV, Object.entries(values).map(([key, value]) => key + '=' + value).join('\n') + '\n');"
      - run: npm test
      - run: npm run coverage
      - run: npm audit --omit=dev --audit-level=high
      - run: npm --prefix web audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm run secret-scan
      - run: npm run guard

  ui:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: jobenpay_test
          POSTGRES_USER: jobenpay
          POSTGRES_PASSWORD: jobenpay
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jobenpay -d jobenpay_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql://jobenpay:jobenpay@localhost:5432/jobenpay_test
      SEED_OWNER_PASSWORD: E2E-Owner-Password-2026!
      SEED_JUDGE_PASSWORD: E2E-Judge-Password-2026!
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
      - run: npm ci
      - run: npm ci --prefix web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - name: Configure ephemeral test keys
        run: |
          node --input-type=module -e "import { appendFileSync } from 'node:fs'; import { generateKeyPairSync, randomBytes } from 'node:crypto'; const signingKey = generateKeyPairSync('ed25519').privateKey.export({ format: 'der', type: 'pkcs8' }).toString('base64'); const values = { JOBENPAY_ENC_KEY: randomBytes(32).toString('base64'), JOBENPAY_LEDGER_SIGNING_KEY: signingKey, JOBENPAY_HMAC_PEPPER: randomBytes(32).toString('base64') }; appendFileSync(process.env.GITHUB_ENV, Object.entries(values).map(([key, value]) => key + '=' + value).join('\n') + '\n');"
      - run: npm --prefix web run build
      - run: npm --prefix web run lint:css
      - run: npm --prefix web run test:geometry
      - run: npm --prefix web run test:e2e

  docker-compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Configure ephemeral app secrets
        run: |
          node --input-type=module -e "import { appendFileSync } from 'node:fs'; import { generateKeyPairSync, randomBytes } from 'node:crypto'; const signingKey = generateKeyPairSync('ed25519').privateKey.export({ format: 'der', type: 'pkcs8' }).toString('base64'); const values = { JOBENPAY_ENC_KEY: randomBytes(32).toString('base64'), JOBENPAY_LEDGER_SIGNING_KEY: signingKey, JOBENPAY_HMAC_PEPPER: randomBytes(32).toString('base64'), PUBLIC_BASE_URL: 'https://localhost:3000' }; appendFileSync(process.env.GITHUB_ENV, Object.entries(values).map(([key, value]) => key + '=' + value).join('\n') + '\n');"
      - run: docker compose up --build --detach
      - name: Wait for /healthz
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://localhost:3000/healthz; then exit 0; fi
            sleep 2
          done
          docker compose logs app
          exit 1
      - if: always()
        run: docker compose down --volumes

  fresh-clone:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Start clean setup timer
        run: date +%s > "$RUNNER_TEMP/fresh-clone-start"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
      - name: Configure ephemeral app secrets
        run: |
          node --input-type=module -e "import { appendFileSync } from 'node:fs'; import { generateKeyPairSync, randomBytes } from 'node:crypto'; const signingKey = generateKeyPairSync('ed25519').privateKey.export({ format: 'der', type: 'pkcs8' }).toString('base64'); const values = { JOBENPAY_ENC_KEY: randomBytes(32).toString('base64'), JOBENPAY_LEDGER_SIGNING_KEY: signingKey, JOBENPAY_HMAC_PEPPER: randomBytes(32).toString('base64'), PUBLIC_BASE_URL: 'https://localhost:3000' }; appendFileSync(process.env.GITHUB_ENV, Object.entries(values).map(([key, value]) => key + '=' + value).join('\n') + '\n');"
      - name: Start PostgreSQL from Compose
        run: docker compose up --detach postgres
      - run: npm ci
      - name: Configure replay-mode demo
        run: |
          cp .env.example .env
          node scripts/gen-keys.js >> .env
          printf '\nSEED_JUDGE_PASSWORD=FreshClone-Judge-Password-2026!\n' >> .env
      - name: Install, build, migrate, and seed
        run: |
          setup_log="$RUNNER_TEMP/jobenpay-setup.log"
          if ! npm run setup >"$setup_log" 2>&1; then
            sed '/Demo agent API key:/d' "$setup_log"
            exit 1
          fi
          sed '/Demo agent API key:/d' "$setup_log"
      - name: Start app and run judge smoke
        env:
          JUDGE_SMOKE_URL: http://localhost:3000
          JUDGE_SMOKE_EMAIL: judge@jobenpay.test
          JUDGE_SMOKE_PASSWORD: FreshClone-Judge-Password-2026!
        run: |
          set -euo pipefail
          log_file="$RUNNER_TEMP/jobenpay-fresh-clone.log"
          npm start >"$log_file" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true; wait "$server_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://localhost:3000/healthz >/dev/null; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            cat "$log_file"
            exit 1
          fi
          node --env-file=.env scripts/judge-smoke.js
          elapsed=$(( $(date +%s) - $(cat "$RUNNER_TEMP/fresh-clone-start") ))
          echo "Fresh-clone setup and judge smoke completed in ${elapsed}s."
          if [ "$elapsed" -gt 600 ]; then
            echo "Fresh-clone setup exceeded the 10-minute limit."
            exit 1
          fi
      - if: always()
        run: docker compose down --volumes
