<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Premium Royal Blue Gradient -->
    <linearGradient id="jpBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0070E0" />
      <stop offset="100%" stop-color="#00256B" />
    </linearGradient>

    <!-- Glowing Electric Pulse Gradient -->
    <linearGradient id="pulseGlowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.4" />
      <stop offset="45%" stop-color="#38BDF8" stop-opacity="1" />
      <stop offset="55%" stop-color="#FFFFFF" stop-opacity="1" />
      <stop offset="70%" stop-color="#38BDF8" stop-opacity="1" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.4" />
    </linearGradient>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Squircle Base with Soft Outer Border -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#jpBgGrad)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="2" />

  <!-- Monogram: "J" -->
  <path
    d="M 44 38 L 44 76 C 44 86 36 92 26 88"
    fill="none"
    stroke="#FFFFFF"
    stroke-width="9"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Monogram: "P" -->
  <path
    d="M 64 88 L 64 38 L 84 38 C 96 38 96 62 84 62 L 64 62"
    fill="none"
    stroke="#FFFFFF"
    stroke-width="9"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Heartbeat ECG / Electric Pulse Motif cutting across horizontally -->
  <path
    d="M 14 62 L 40 62 L 48 62 L 54 74 L 62 24 L 72 98 L 80 62 L 88 62 L 114 62"
    fill="none"
    stroke="url(#pulseGlowGrad)"
    stroke-width="5"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#softGlow)"
  />
</svg>
