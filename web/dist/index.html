<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a2b9e" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <title>JOBENPAY</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Arial, "Helvetica Neue", Helvetica, sans-serif;
      }

      body {
        margin: 0;
        background:
          radial-gradient(circle at top, rgba(31, 120, 255, 0.16), transparent 42%),
          linear-gradient(180deg, #f8fbff 0%, #eef4fb 100%);
      }

      .bootSplash {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
      }

      .bootSplash__panel {
        width: min(100%, 560px);
        display: grid;
        justify-items: center;
        gap: 16px;
        padding: 32px 28px;
        text-align: center;
        border-radius: 28px;
        background: rgba(255, 255, 255, 0.82);
        backdrop-filter: blur(14px);
        border: 1px solid rgba(17, 75, 199, 0.12);
        box-shadow: 0 22px 64px rgba(10, 43, 158, 0.12);
      }

      .bootSplash__mark {
        width: 88px;
        height: auto;
        max-height: 80px;
        object-fit: contain;
        filter: drop-shadow(0 16px 24px rgba(10, 43, 158, 0.18));
        animation: bootFloat 2.8s ease-in-out infinite;
      }

      .bootSplash__eyebrow,
      .bootSplash__title,
      .bootSplash__copy {
        margin: 0;
      }

      .bootSplash__eyebrow {
        color: #0a2b9e;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.18em;
      }

      .bootSplash__title {
        color: #0d1d46;
        font-size: clamp(28px, 4vw, 40px);
        line-height: 1.1;
      }

      .bootSplash__copy {
        color: #6c7378;
        font-size: 15px;
        line-height: 1.7;
        max-width: 38ch;
      }

      .bootSplash__track {
        width: min(100%, 320px);
        height: 8px;
        border-radius: 999px;
        overflow: hidden;
        background: rgba(10, 43, 158, 0.08);
      }

      .bootSplash__track span {
        display: block;
        width: 42%;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, #0a2b9e, #149dff, #67d2ff);
        animation: bootLoading 1.8s ease-in-out infinite;
      }

      @keyframes bootFloat {
        50% {
          transform: translateY(-6px);
        }
      }

      @keyframes bootLoading {
        0% {
          transform: translateX(-80%);
        }

        50% {
          transform: translateX(75%);
        }

        100% {
          transform: translateX(210%);
        }
      }
    </style>
    <script type="module" crossorigin src="/assets/index-BRGNDP_v.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-BX4RDVrE.css">
  </head>
  <body>
    <div id="root">
      <div class="bootSplash" role="status" aria-live="polite" aria-busy="true">
        <div class="bootSplash__panel">
          <img class="bootSplash__mark" src="/favicon.svg" alt="" />
          <p class="bootSplash__eyebrow">JOBENPAY</p>
          <h1 class="bootSplash__title">Preparing your workspace</h1>
          <p class="bootSplash__copy">Secure payout controls, loading with a clean and consistent visual shell.</p>
          <div class="bootSplash__track" aria-hidden="true"><span></span></div>
        </div>
      </div>
    </div>
  </body>
</html>
